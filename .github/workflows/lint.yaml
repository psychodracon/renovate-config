name: Lint

on:
    push:
        branches: [main]
        paths:
            - default.json
            - renovate.json
            - .github/workflows/lint.yaml
    pull_request:
        paths:
            - default.json
            - renovate.json
            - .github/workflows/lint.yaml

permissions:
    contents: read

concurrency:
    group: lint-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    renovate:
        name: Renovate config
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Setup / Checkout repository
              uses: actions/checkout@v7

            - name: Lint / Validate configs
              run: npx --yes --package renovate -- renovate-config-validator --strict --no-global default.json renovate.json
